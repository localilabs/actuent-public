<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actuent — Human Debug Mode</title>
  <meta name="description" content="Search any website and see the structured data AI agents get back">
  <meta property="og:title" content="Actuent — search as an AI agent sees it">
  <meta property="og:description" content="Search any website and see the structured data AI agents get back">
  <meta property="og:url" content="https://humans.actuent.ai/">
  <meta property="og:image" content="https://api.actuent.ai/og?title=Actuent&amp;subtitle=Search%20any%20website%20and%20see%20what%20AI%20agents%20get&amp;tag=humans.actuent.ai">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="https://api.actuent.ai/assets/actuent-logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; }
    header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 56px; }
    header img { height: 24px; }
    header a { color: #ff8a3d; font-size: 12px; text-decoration: none; }
    header a:hover { color: #f0f0f0; }
    .badge { background: #17171f; border: 1px solid #34343f; color: #a8a8b6; font-size: 10px; padding: 4px 14px; border-radius: 20px; margin-bottom: 24px; letter-spacing: 2px; text-transform: uppercase; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: -1px; text-align: center; }
    h1 span { color: #8e8e9c; }
    .sub { color: #a8a8b6; font-size: 13px; margin-bottom: 40px; text-align: center; }
    .sub a { color: #ff8a3d; text-decoration: none; }
    .search-box { display: flex; gap: 10px; width: 100%; max-width: 560px; margin-bottom: 36px; }
    #query { flex: 1; background: #17171f; border: 1px solid #34343f; color: #f0f0f0; padding: 12px 16px; font-size: 14px; font-family: 'Courier New', monospace; border-radius: 8px; outline: none; min-width: 0; }
    #query:focus { border-color: #55555f; }
    #query::placeholder { color: #8e8e9c; }
    #btn { background: #ff8a3d; color: #0a0a0a; border: none; padding: 12px 22px; font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    #btn:hover { opacity: 0.85; }
    #btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #status { color: #a8a8b6; font-size: 12px; margin-bottom: 20px; min-height: 18px; text-align: center; }
    .results { width: 100%; max-width: 800px; }
    .card { background: #13131a; border: 1px solid #2a2a34; border-radius: 10px; padding: 22px; margin-bottom: 14px; }
    .site-domain { font-size: 16px; font-weight: 700; font-family: 'Courier New', monospace; }
    .site-name { color: #a8a8b6; font-size: 12px; margin-top: 2px; margin-bottom: 18px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: -8px 0 16px; }
    .tag { font-size: 10px; padding: 3px 9px; border-radius: 20px; border: 1px solid #34343f; color: #c4c4cf; letter-spacing: .5px; }
    .tag.exec { background: #ff8a3d; color: #0a0a0a; border-color: #ff8a3d; font-weight: 700; }
    .run { display: inline-block; font-size: 9px; padding: 1px 6px; border-radius: 4px; background: #ff8a3d; color: #0a0a0a; font-weight: 700; margin-left: 6px; vertical-align: middle; }
    .section { color: #8e8e9c; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; margin-top: 16px; }
    .page { background: #0a0a0a; border: 1px solid #2a2a34; border-radius: 7px; padding: 10px 14px; margin-bottom: 6px; }
    .page-path { color: #a8a8b6; font-size: 10px; font-family: 'Courier New', monospace; margin-bottom: 3px; }
    .page-title { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
    .page-content { color: #a8a8b6; font-size: 12px; line-height: 1.5; }
    .action { background: #0a0a0a; border: 1px solid #2a2a34; border-radius: 7px; padding: 10px 14px; margin-bottom: 6px; display: flex; gap: 10px; }
    .dot { width: 6px; height: 6px; background: #ff8a3d; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .action-name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .action-desc { color: #a8a8b6; font-size: 11px; }
    .intents { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .intent { background: #1c1c25; color: #a8a8b6; font-size: 10px; padding: 2px 7px; border-radius: 4px; }
    .score-box { display: flex; gap: 14px; background: #0a0a0a; border: 1px solid #2a2a34; border-radius: 7px; padding: 14px; margin-top: 14px; }
    .score-num { font-size: 28px; font-weight: 700; font-family: 'Courier New', monospace; min-width: 44px; }
    .score-label { font-size: 10px; color: #8e8e9c; margin-top: 3px; }
    .score-lines { font-size: 11px; color: #8e8e9c; line-height: 1.9; }
    .raw-btn { color: #8e8e9c; font-size: 11px; cursor: pointer; margin-top: 14px; text-decoration: underline; background: none; border: none; padding: 0; font-family: inherit; display: block; }
    .raw-btn:hover { color: #a8a8b6; }
    .raw { background: #0a0a0a; border: 1px solid #2a2a34; border-radius: 7px; padding: 14px; font-size: 11px; font-family: 'Courier New', monospace; color: #a8a8b6; overflow-x: auto; white-space: pre; margin-top: 8px; display: none; }
    .empty { color: #8e8e9c; font-size: 14px; text-align: center; padding: 56px; }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 1px solid #45454f; border-top-color: #888; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 600px) { body { padding: 28px 14px; } h1 { font-size: 22px; } .search-box { flex-direction: column; } #btn { width: 100%; } }
  </style>
</head>
<body>

<header>
  <img src="https://api.actuent.ai/assets/actuent-logo.png" alt="Actuent">
  <a href="https://docs.actuent.ai">Docs →</a>
</header>

<div class="badge">⚠ Human Debug Mode</div>
<h1>Actuent <span>for humans</span></h1>
<p class="sub">Developers only. AI agents connect via <a href="https://docs.actuent.ai">agents.actuent.ai</a></p>

<div class="search-box">
  <input type="text" id="query" placeholder="nike.com or 'barber amsterdam'..." onkeydown="if(event.key==='Enter')doSearch()">
  <button id="btn" onclick="doSearch()">Search</button>
</div>

<div id="status"></div>
<div class="results" id="results"></div>

<script>
function scoreLAWP(site) {
  var score = 0, lines = []
  var pc = Object.keys(site.pages||{}).length
  var ac = (site.actions||[]).length
  var ai = ac > 0 ? site.actions.reduce(function(s,a){return s+(a.intent?a.intent.length:0)},0)/ac : 0
  var cc = pc > 0 ? Object.values(site.pages).reduce(function(s,p){return s+(p.content?p.content.length:0)},0)/pc : 0
  if(pc>=3){score+=25;lines.push("✓ 3+ pages")} else if(pc>=1){score+=10;lines.push("△ Few pages")} else{lines.push("✗ No pages")}
  if(ac>=3){score+=25;lines.push("✓ 3+ actions")} else if(ac>=1){score+=15;lines.push("△ Some actions")} else{lines.push("✗ No actions")}
  if(ai>=5){score+=20;lines.push("✓ Rich intents")} else if(ai>=3){score+=10;lines.push("△ Some intents")} else{lines.push("✗ Thin intents")}
  if(cc>=200){score+=15;lines.push("✓ Rich content")} else if(cc>=80){score+=8;lines.push("△ Some content")} else{lines.push("✗ Thin content")}
  if(site.name&&site.name!==site.domain){score+=15;lines.push("✓ Named")} else{lines.push("✗ Unnamed")}
  return {score:Math.min(score,100),lines:lines}
}

function toggleRaw(i) {
  var el = document.getElementById("raw"+i)
  el.style.display = el.style.display==="block" ? "none" : "block"
}

function doSearch() {
  var query = document.getElementById("query").value.trim()
  if (!query) return

  var btn = document.getElementById("btn")
  var status = document.getElementById("status")
  var results = document.getElementById("results")

  btn.disabled = true
  btn.textContent = "Searching..."
  status.innerHTML = '<span class="spinner"></span>Fetching LAWP — free tier crawls live, may take a few seconds...'
  results.innerHTML = ""

  fetch("https://api.actuent.ai/api/search", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({query: query})
  })
  .then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status)
    return r.json()
  })
  .then(function(data) {
    btn.disabled = false
    btn.textContent = "Search"

    if (!data.results || data.results.length === 0) {
      results.innerHTML = '<div class="empty">No LAWP found for "' + query + '"</div>'
      status.textContent = ""
      return
    }

    status.textContent = data.count + " result" + (data.count !== 1 ? "s" : "") + " found"

    results.innerHTML = data.results.map(function(site, i) {
      var s = scoreLAWP(site)
      var col = s.score >= 80 ? "#4ade80" : s.score >= 50 ? "#ff8a3d" : "#a8a8b6"

      var pages = Object.entries(site.pages || {}).map(function(e) {
        return '<div class="page"><div class="page-path">'+e[0]+'</div><div class="page-title">'+(e[1].title||"")+'</div><div class="page-content">'+(e[1].content||"")+'</div></div>'
      }).join("")

      var actions = (site.actions || []).map(function(a) {
        var intents = (a.intent||[]).map(function(t){return '<span class="intent">'+t+'</span>'}).join("")
        var run = site.native && a.endpoint && a.endpoint.url ? '<span class="run">EXECUTABLE</span>' : ''
        return '<div class="action"><div class="dot"></div><div><div class="action-name">'+(a.name||"")+run+'</div><div class="action-desc">'+(a.description||"")+'</div><div class="intents">'+intents+'</div></div></div>'
      }).join("")

      return '<div class="card">' +
        '<div class="site-domain">'+site.domain+'</div>' +
        '<div class="site-name">'+(site.name||"")+'</div>' +
        ((site.native || site.executable) ? '<div class="tags">' +
          (site.executable ? '<span class="tag exec" title="AI agents can perform this site\'s actions via LAWP">⚡ Executable actions</span>' : '') +
          (site.native ? '<span class="tag" title="Published by the site at /.well-known/lawp.json">Native LAWP</span>' : '') +
        '</div>' : '') +
        '<div class="section">Pages</div>' + (pages || '<div class="page"><div class="page-content" style="color:#8e8e9c">No pages</div></div>') +
        '<div class="section">Actions</div>' + (actions || '<div class="action"><div class="dot" style="background:#222"></div><div><div class="action-desc" style="color:#8e8e9c">No actions defined</div></div></div>') +
        '<div class="score-box"><div><div class="score-num" style="color:'+col+'">'+s.score+'</div><div class="score-label">LAWP / 100</div></div><div class="score-lines">'+s.lines.join("<br>")+'</div></div>' +
        '<button class="raw-btn" onclick="toggleRaw('+i+')">view raw LAWP</button>' +
        '<pre class="raw" id="raw'+i+'">'+JSON.stringify(site,null,2)+'</pre>' +
        '</div>'
    }).join("")
  })
  .catch(function(err) {
    btn.disabled = false
    btn.textContent = "Search"
    status.textContent = "Error: " + err.message
    results.innerHTML = '<div class="empty">Could not reach api.actuent.ai</div>'
  })
}
</script>
</body>
</html>
