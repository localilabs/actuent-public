    .results { width: 100%; max-width: 820px; }

    .box.accent { border-color: #5a3a22; background: #17120d; }

    .answer-line { font-size: 14px; line-height: 1.55; margin-bottom: 10px; }

    .vs { display: flex; align-items: center; gap: 14px; font-size: 18px; font-weight: 700; font-family: 'Courier New', monospace; flex-wrap: wrap; }
    .vs span { color: #8e8e9c; font-size: 13px; font-family: inherit; font-weight: 400; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }

    .site-name { color: #a8a8b6; font-size: 13px; }

    .snippet { color: #c4c4cf; font-size: 13px; line-height: 1.55; margin: 8px 0; }
    .meta { color: #8e8e9c; font-size: 12px; line-height: 1.6; }

    .page-path { color: #a8a8b6; font-size: 10px; font-family: 'Courier New', monospace; margin-bottom: 3px; }
    .page-title { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
    .page-content { color: #a8a8b6; font-size: 12px; line-height: 1.5; }
    .action { background: #0a0a0a; border: 1px solid #2a2a34; border-radius: 7px; padding: 10px 14px; margin-bottom: 6px; }
    .action-name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .action-desc { color: #a8a8b6; font-size: 11px; }
    .intent { display: inline-block; background: #1c1c25; color: #a8a8b6; font-size: 10px; padding: 2px 7px; border-radius: 4px; margin: 4px 4px 0 0; }
    .run { display: inline-block; font-size: 9px; padding: 1px 6px; border-radius: 4px; background: #ff8a3d; color: #0a0a0a; font-weight: 700; margin-left: 6px; vertical-align: middle; }
    .quality { font-size: 12px; color: #8e8e9c; line-height: 1.8; }
    .quality b { font-family: 'Courier New', monospace; font-size: 16px; }
    .raw { background: #0a0a0a; border: 1px solid #2a2a34; border-radius: 7px; padding: 14px; font-size: 11px; font-family: 'Courier New', monospace; color: #a8a8b6; overflow-x: auto; white-space: pre; max-height: 420px; }
    .empty { color: #8e8e9c; font-size: 14px; text-align: center; padding: 48px 16px; line-height: 1.6; }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 1px solid #45454f; border-top-color: #888; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { color: #55555f; font-size: 11px; margin-top: 48px; text-align: center; }
    footer a { color: #8e8e9c; }
    @media (max-width: 600px) { body { padding: 28px 16px; } header { margin-bottom: 36px; } h1 { font-size: 22px; } .search-box { flex-direction: column; } #btn { width: 100%; } .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>

<div id="busy-banner" role="status" style="display:none;background:#2a1d10;border-bottom:1px solid #ff8a3d;color:#ffd9bf;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:10px 16px;text-align:center;position:fixed;top:0;left:0;right:0;z-index:20"></div>
<script>
// "Busy right now" banner (api.actuent.ai/api/status), refreshed every minute.
(function busy() {
  fetch("https://api.actuent.ai/api/status").then(function(r) { return r.json() }).then(function(s) {
    var b = document.getElementById("busy-banner")
    // Lawpy thinks alongside the message (public/assets/lawpy.js).
    if (s.busy && s.message) {
      b.innerHTML = '<lawpy-mascot state="think" scale="2" style="vertical-align:middle;margin-right:10px"></lawpy-mascot><span></span>'
      b.lastChild.textContent = s.message
      b.style.display = "block"
    } else b.style.display = "none"
  }).catch(function() {})
  setTimeout(busy, 60000)
})()
</script>

<header>

  <a href="https://docs.actuent.ai">Docs →</a>

<h1>Actuent <span>for humans</span></h1>

<script>
function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function(c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c] }) }
// Only http(s) links are ever put in an href.
function safeUrl(u) { return /^https?:\/\//i.test(String(u || "")) ? esc(u) : "#" }
function searchLink(v) { return '<a href="?q=' + encodeURIComponent(v) + '" onclick="event.preventDefault();searchFor(this.dataset.v)" data-v="' + esc(v) + '">' + esc(v) + '</a>' }

// A rough quality score for a site's LAWP (pages, actions, intents, content, name).
function scoreLAWP(site) {
  var score = 0, lines = []
  var pc = Object.keys(site.pages || {}).length
  var ac = (site.actions || []).length
  var ai = ac > 0 ? site.actions.reduce(function(s, a) { return s + (a.intent ? a.intent.length : 0) }, 0) / ac : 0
  var cc = pc > 0 ? Object.values(site.pages).reduce(function(s, p) { return s + (p && p.content ? p.content.length : 0) }, 0) / pc : 0
  if (pc >= 3) { score += 25; lines.push("✓ 3+ pages") } else if (pc >= 1) { score += 10; lines.push("△ Few pages") } else lines.push("✗ No pages")
  if (ac >= 3) { score += 25; lines.push("✓ 3+ actions") } else if (ac >= 1) { score += 15; lines.push("△ Some actions") } else lines.push("✗ No actions")
  if (ai >= 5) { score += 20; lines.push("✓ Rich intents") } else if (ai >= 3) { score += 10; lines.push("△ Some intents") } else lines.push("✗ Thin intents")
  if (cc >= 200) { score += 15; lines.push("✓ Rich content") } else if (cc >= 80) { score += 8; lines.push("△ Some content") } else lines.push("✗ Thin content")
  if (site.name && site.name !== site.domain) { score += 15; lines.push("✓ Named") } else lines.push("✗ Unnamed")
  return { score: Math.min(score, 100), lines: lines }
}

function money(amount, currency) {
  if (amount == null) return ""
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency: currency || "EUR", maximumFractionDigits: amount % 1 ? 2 : 0 }).format(amount) }
  catch (e) { return esc(amount) + " " + esc(currency || "") }
}

function shortDate(d) {
  var t = Date.parse(d); if (isNaN(t)) return ""
  return new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short" })
}

// Hints: spelling, interpretation and related searches, as links that run the search.
function hintsHtml(data) {
  var hints = []
  if (data.searched_for) hints.push('Showing results for ' + searchLink(data.searched_for))
  else if (data.did_you_mean) hints.push('Did you mean ' + searchLink(data.did_you_mean) + '?')
  if (data.interpreted_as) hints.push('Searched for “' + esc(data.interpreted_as) + '”')
  if (data.related && data.related.length) hints.push('Related: ' + data.related.map(searchLink).join(" · "))
  return hints.length ? '<div class="hints">' + hints.join(" &nbsp;|&nbsp; ") + '</div>' : ""
}

// "does basecamp have a free plan": sentences from the site's own pages.
function answerHtml(a) {
  if (!a || !a.sentences || !a.sentences.length) return ""
  return '<div class="box accent"><div class="section">From ' + esc(a.domain) + '’s own pages</div>' +
    a.sentences.map(function(s) { return '<div class="answer-line">“' + esc(s.text) + '”<a href="' + safeUrl(s.url) + '" target="_blank" rel="noopener">source</a></div>' }).join("") +
    '<div class="muted small">' + esc(a.note || "") + '</div></div>'
}

// "notion vs obsidian": both sites head the results.
function comparisonHtml(c) {
  if (!c || !c.sites || c.sites.length < 2) return ""
  return '<div class="box accent"><div class="section">Comparison</div><div class="vs">' + esc(c.sites[0]) + '<span>vs</span>' + esc(c.sites[1]) + '</div>' +
    '<div class="muted small" style="margin-top:8px">' + esc(c.tip || "") + '</div></div>'
}

function productsHtml(items) {
  if (!items || !items.length) return ""
  return '<div class="box"><div class="section">Products · ' + items.length + '</div><div class="grid">' + items.slice(0, 12).map(function(p) {
    var others = p.other_shops && p.other_shops.length ? '<div class="muted">+' + p.other_shops.length + ' other shop' + (p.other_shops.length > 1 ? 's' : '') + '</div>' : ""
    var drop = p.price_change_percent < 0 ? '<span class="down">' + esc(p.price_change_percent) + '%</span>' : ""
    return '<a class="product" href="' + safeUrl(p.visit_url || p.url) + '" target="_blank" rel="noopener">' +
      (p.image ? '<img src="' + safeUrl(p.image) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<div class=noimg></div>\'">' : '<div class="noimg"></div>') +
      '<div class="body">' + esc(p.name) + '<div class="price">' + money(p.price, p.currency) + drop + '</div>' +
      '<div class="muted">' + esc(p.domain) + (p.available === false ? ' · sold out' : '') + '</div>' + others + '</div></a>'
  }).join("") + '</div></div>'
}

function eventsHtml(items) {
  if (!items || !items.length) return ""
  return '<div class="box"><div class="section">Upcoming events</div>' + items.map(function(e) {
    var where = [e.venue, e.city].filter(Boolean).map(esc).join(", ")
    return '<div class="row"><div class="date">' + shortDate(e.start_date) + '</div><div><a href="' + safeUrl(e.url) + '" target="_blank" rel="noopener">' + esc(e.name) + '</a>' +
      '<div class="muted small">' + [where, e.price != null ? money(e.price, e.currency) : "", esc(e.domain)].filter(Boolean).join(" · ") + '</div></div></div>'
  }).join("") + '</div>'
}

// Local searches with no indexed websites yet: places from OpenStreetMap, labelled as such.
function placesHtml(places) {
  if (!places || !places.items || !places.items.length) return ""
  return '<div class="box"><div class="section">Places from OpenStreetMap</div>' + places.items.map(function(p) {
    return '<div class="row"><div><b>' + esc(p.name) + '</b> <span class="muted">' + esc(p.type) + '</span><div class="muted small">' + esc(p.address) +
      (p.website ? ' · <a href="' + safeUrl(p.website) + '" rel="nofollow noopener" target="_blank">website</a>' : '') +
      (p.map ? ' · <a href="' + safeUrl(p.map) + '" rel="noopener" target="_blank">map</a>' : '') + '</div></div></div>'
  }).join("") + '<div class="muted small" style="margin-top:6px">© OpenStreetMap contributors</div></div>'
}

function siteHtml(site, i, first) {
  var s = scoreLAWP(site)
  var col = s.score >= 80 ? "#4ade80" : s.score >= 50 ? "#ff8a3d" : "#a8a8b6"
  var pageList = Object.entries(site.pages || {})
  var pages = pageList.map(function(e) {
    var p = e[1] || {}
    return '<div class="page"><div class="page-path">' + esc(e[0]) + '</div><div class="page-title">' + esc(p.title || "") + '</div><div class="page-content">' + esc(p.content || "") + '</div></div>'
  }).join("")
  var actions = (site.actions || []).map(function(a) {
    var intents = (a.intent || []).map(function(t) { return '<span class="intent">' + esc(t) + '</span>' }).join("")
    var run = site.native && a.endpoint && a.endpoint.url ? '<span class="run">EXECUTABLE</span>' : ''
    return '<div class="action"><div class="action-name">' + esc(a.name || "") + run + '</div><div class="action-desc">' + esc(a.description || "") + '</div>' + intents + '</div>'
  }).join("")
  var b = site.business || {}
  var addr = b.address ? [b.address.street, b.address.city].filter(Boolean).join(", ") : ""
  var tags = [
    first ? '<span class="tag first">' + esc(first) + '</span>' : '',
    site.executable ? '<span class="tag exec" title="AI agents can perform this site\'s actions via LAWP">⚡ Executable</span>' : '',
    site.native ? '<span class="tag" title="Published by the site at /.well-known/lawp.json">Native LAWP</span>' : '',
    site.category ? '<span class="tag">' + esc(String(site.category).replace(/_/g, " ")) + '</span>' : ''
  ].join("")
  var meta = [
    site.open_now === true ? '<span class="open">Open now</span>' : site.open_now === false ? 'Closed now' : '',
    addr ? esc(addr) : '',
    b.stars ? esc(b.stars) + '★' : '',
    site.matched ? 'Why: ' + esc(site.matched) : '',
    site.regional_sites && site.regional_sites.length ? 'Also: ' + site.regional_sites.map(esc).join(", ") : '',
    site.age_hours != null ? 'Updated ' + (site.age_hours < 48 ? esc(site.age_hours) + 'h' : Math.round(site.age_hours / 24) + 'd') + ' ago' : ''
  ].filter(Boolean).join(" · ")

  return '<div class="card">' +
    '<div class="card-top"><div><a class="site-domain" href="' + safeUrl(site.visit_url || ("https://" + site.domain)) + '" target="_blank" rel="noopener">' + esc(site.domain) + '</a> ' +
      '<span class="site-name">' + esc(site.name && site.name !== site.domain ? site.name : "") + '</span></div>' +
      '<div class="score">' + (site.score ? 'match ' + esc(site.score) : '') + '</div></div>' +
    (tags ? '<div class="tags" style="margin-top:6px">' + tags + '</div>' : '') +
    (site.snippet ? '<div class="snippet">' + esc(site.snippet) + '</div>' : '') +
    (meta ? '<div class="meta">' + meta + '</div>' : '') +
    '<details><summary>' + pageList.length + ' page' + (pageList.length !== 1 ? 's' : '') + ' · ' + (site.actions || []).length + ' action' + ((site.actions || []).length !== 1 ? 's' : '') + '</summary>' +
      (pages || '<div class="page-content muted">No pages</div>') + (actions ? '<div class="section" style="margin-top:12px">Actions</div>' + actions : '') +
    '</details>' +
    '<details><summary>LAWP quality <span style="color:' + col + '">' + s.score + '/100</span></summary><div class="quality">' + s.lines.join("<br>") + '</div></details>' +
    '<details><summary>Raw JSON (what the agent gets)</summary><pre class="raw">' + esc(JSON.stringify(site, null, 2)) + '</pre></details>' +
    '</div>'
}

var searchId = 0
function doSearch() {
  var query = document.getElementById("query").value.trim()
  if (!query) return
  try { history.replaceState(null, "", "?q=" + encodeURIComponent(query)) } catch (e) {}
  document.title = query + " — Actuent"

  var btn = document.getElementById("btn"), status = document.getElementById("status"), results = document.getElementById("results")
  btn.disabled = true
  btn.textContent = "Searching…"
  status.innerHTML = '<span class="spinner"></span>Searching…'
  results.innerHTML = ""
  var started = Date.now()
  lawpy("think")
  var id = ++searchId, finished = false
  // The quick first answer (best-known sites, in well under a second) while the full search runs.
  fetch("https://api.actuent.ai/api/search?fast=1&q=" + encodeURIComponent(query)).then(function(r) { return r.ok ? r.json() : null }).then(function(quick) {
    if (finished || id !== searchId || !quick || !quick.results || !quick.results.length) return
    status.innerHTML = '<span class="spinner"></span>Quick results · finding more…'
    results.innerHTML = quick.results.map(function(site, i) { return siteHtml(site, i, site.matched === "exact name" ? "exact name" : "") }).join("")
  }).catch(function() {})

  // GET, so identical searches come straight from the CDN cache on busy days.
  fetch("https://api.actuent.ai/api/search?q=" + encodeURIComponent(query))
  .then(function(r) {
    // Busy or rate-limited answers carry a plain-English message: show it.
    return r.json().catch(function() { return {} }).then(function(data) {
      if (!r.ok) throw new Error(data.message || "Sorry — too many people are using Actuent right now. Please try again later.")
      return data
    })
  })
  .then(function(data) {
    finished = true
    if (id !== searchId) return
    btn.disabled = false
    btn.textContent = "Search"
    var sites = data.results || []
    var extras = comparisonHtml(data.comparison) + answerHtml(data.answer) + productsHtml(data.products) + eventsHtml(data.events) + placesHtml(data.places)
    var parts = [sites.length ? sites.length + " site" + (sites.length !== 1 ? "s" : "") : "",
      data.products && data.products.length ? data.products.length + " product" + (data.products.length !== 1 ? "s" : "") : "",
      data.events && data.events.length ? data.events.length + " event" + (data.events.length !== 1 ? "s" : "") : ""].filter(Boolean)
    status.textContent = parts.length ? parts.join(" · ") + " · " + ((Date.now() - started) / 1000).toFixed(1) + "s" : ""
    // Lawpy: explains an answer, dances when something was found, calms down when nothing was.
    lawpy(data.answer || data.comparison ? "talk" : sites.length || extras ? "dance" : "idle", 2)

    var note = data.message ? '<div class="empty" style="padding:0 0 14px">' + esc(data.message) + '</div>' : ""
    if (!sites.length && !extras) {
      results.innerHTML = '<div class="empty">' + esc(data.message || ('Nothing found for “' + query + '” yet.')) + '</div>' + hintsHtml(data)
      return
    }
    var compared = data.comparison && data.comparison.sites || []
    results.innerHTML = note + hintsHtml(data) + extras +
      (sites.length && extras ? '<div class="section" style="margin:18px 0 10px">Sites</div>' : '') +
      sites.map(function(site, i) {
        var first = compared.indexOf(site.domain) >= 0 ? "compared" :
          data.answer && data.answer.domain === site.domain ? "answer source" :
          site.matched === "exact name" || site.matched === "exact domain" ? site.matched : ""
        return siteHtml(site, i, first)
      }).join("")
  })
  .catch(function(err) {
    finished = true
    if (id !== searchId) return
    btn.disabled = false
    btn.textContent = "Search"
    status.textContent = ""
    results.innerHTML = '<div class="empty">' + esc(err.message && !/fetch|network/i.test(err.message) ? err.message : "Couldn't reach Actuent. Check your connection and try again.") + '</div>'
    lawpy("idle")
  })
}
// Lawpy reacts to the search (public/assets/lawpy.js); nothing happens if the script didn't load.
function lawpy(state, loops) {
  var el = document.getElementById("lawpy")
  if (el && el.play) el.play(state, loops ? { loops: loops, then: "idle" } : {})
}
function searchFor(v) { document.getElementById("query").value = v; doSearch(); window.scrollTo({ top: 0, behavior: "smooth" }) }
</script>
<script>
// Shareable searches (?q=…), example chips, "/" to focus the search box, and autocomplete (api/autocomplete).
(function() {
  var input = document.getElementById("query"), list = document.getElementById("ac"), timer = null
  var q = new URLSearchParams(location.search).get("q")
  if (q) { input.value = q; setTimeout(doSearch, 0) }
  document.getElementById("chips").addEventListener("click", function(e) {
    var b = e.target.closest(".chip"); if (b) searchFor(b.textContent)
  })
  document.addEventListener("keydown", function(e) {
    if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus() }
    if (e.key === "Escape") list.style.display = "none"
  })
  input.addEventListener("input", function() {
    clearTimeout(timer)
    var v = input.value.trim()
    if (v.length < 2) { list.style.display = "none"; return }
    timer = setTimeout(function() {
      fetch("https://api.actuent.ai/api/autocomplete?q=" + encodeURIComponent(v)).then(function(r) { return r.json() }).then(function(d) {
        var items = (d.searches || []).map(function(s) { return { label: s, value: s } })
          .concat((d.sites || []).map(function(s) { return { label: s.name + " — " + s.domain, value: s.domain } }))
        if (!items.length || input.value.trim() !== v) { list.style.display = "none"; return }
        list.innerHTML = items.map(function(it) { return '<li role="option" tabindex="-1" data-v="' + esc(it.value) + '">' + esc(it.label) + '</li>' }).join("")
        list.style.display = "block"
      }).catch(function() {})
    }, 150)
  })
  list.addEventListener("mousedown", function(e) {
    var li = e.target.closest("li"); if (!li) return
    e.preventDefault(); input.value = li.getAttribute("data-v"); list.style.display = "none"; doSearch()
  })
  input.addEventListener("blur", function() { setTimeout(function() { list.style.display = "none" }, 150) })
})()
</script>
</body>
