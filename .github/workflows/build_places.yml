name: Build US Places
# Weekly: places with opening hours for the biggest US cities (scripts/build_places.mjs), committed
# as data/us_places.json so place searches are instant and don't depend on OpenStreetMap's servers.
on:
  # Night-time in Europe and the US, when OpenStreetMap's Overpass server isn't overloaded (evenings it
  # answers 504). Weekly on Sundays, plus once on 2 October to fill the file before launch.
  schedule:
    - cron: '0 4 * * 0'
    - cron: '0 3 2 10 *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build_places.mjs
        timeout-minutes: 100
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "actuent-bot"
          git config user.email "bot@actuent.ai"
          git add data/us_places.json
          git diff --cached --quiet || (git commit -m "Weekly US places refresh" && git pull --rebase -q && git push)
