name: Check Search After Deploy
on:
  deployment_status:
  workflow_dispatch:
# A newer deploy cancels a check still running for an older one.
concurrency:
  group: smoke
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Give the new deploy a moment to take over from the old one.
      - run: sleep 30
      - run: node scripts/smoke.mjs
